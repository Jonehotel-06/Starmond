<li class="card">
  <div class="thumb">
    {% if product.primary_image %}<img src="{{ product.primary_image.image.url }}" alt="{{ product.name }}" loading="lazy" width="400" height="300">
    {% else %}<span>{{ product.category.name }}</span>{% endif %}
  </div>
  <div class="body">
    {% if product.on_sale %}<span class="badge">Sale</span>{% endif %}
    <h3><a href="{{ product.absolute_path }}">{{ product.name }}</a></h3>
    <p class="price">&#8358;{{ product.price }}{% if product.compare_at_price %}<span class="was">&#8358;{{ product.compare_at_price }}</span>{% endif %}</p>
  </div>
</li>

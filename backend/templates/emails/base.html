<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block subject %}{{ business_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e6e8ec;">
        <tr>
          <td style="background:#0b1f3a;padding:22px 28px;">
            <a href="{{ frontend_url }}" style="color:#ffffff;text-decoration:none;font-size:19px;font-weight:700;letter-spacing:.4px;">
              {{ business_name }}
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:28px;color:#1c2430;font-size:15px;line-height:1.6;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:18px 28px;background:#f9fafb;border-top:1px solid #e6e8ec;color:#6b7280;font-size:12px;line-height:1.6;">
            <p style="margin:0 0 6px;">{{ business_name }} — Nigeria</p>
            <p style="margin:0;">Need help? Reply to this email or contact <a href="mailto:{{ support_email }}" style="color:#0b5fff;">{{ support_email }}</a>.</p>
            <p style="margin:8px 0 0;">This is an automated transactional message about your account or order.</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

{% extends "emails/base.html" %}
{% block content %}
<p>Hello {{ full_name }},</p>
<p>We received a request to reset your password. Click below to choose a new one.</p>
<p style="margin:24px 0;"><a href="{{ reset_url }}" style="background:#0b1f3a;color:#fff;padding:12px 22px;border-radius:6px;text-decoration:none;display:inline-block;">Reset password</a></p>
<p style="color:#667085;font-size:13px;">If you did not request this, no action is needed — the link will expire shortly.</p>
{% endblock %}

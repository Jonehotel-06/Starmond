# ============================================================================
# nginx — Starmond storefront (static) + Django API reverse proxy
#
# Key points:
#   • SEO-friendly /shop/... and /products/... URLs resolve to pre-rendered
#     files when they exist, and fall back to the runtime page otherwise.
#   • /api/ is proxied to Django on the SAME origin, so session cookies and
#     CSRF work without CORS.
#   • Correct HTTP status codes: 404 for missing pages, never a soft-200.
# ============================================================================

server {
    listen 443 ssl http2;
    server_name your-store-domain.example;

    ssl_certificate     /etc/ssl/certs/starmond.crt;
    ssl_certificate_key /etc/ssl/private/starmond.key;

    root /var/www/starmond/frontend;
    index index.html;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Paystack redirect flow needs no inline script beyond our own JSON-LD.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://checkout.paystack.com" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    brotli on;
    brotli_types text/css application/javascript application/json image/svg+xml;

    # --- API: same-origin proxy to Django -----------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Backend-generated media and sitemap
    location /media/ { proxy_pass http://127.0.0.1:8000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8000; }

    # --- Never cache private HTML -------------------------------------------
    location ~ ^/(admin|cart|checkout|account|orders|order-detail|wishlist|login|register|payment-) {
        add_header Cache-Control "no-store, private" always;
        try_files $uri $uri/ =404;
    }

    # --- Immutable static assets --------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SEO-friendly category URLs -----------------------------------------
    # Pre-rendered /shop/<slug>/index.html wins; otherwise the runtime page.
    location /shop/ {
        try_files $uri $uri/index.html /category.html;
    }

    # --- SEO-friendly product URLs ------------------------------------------
    location /products/ {
        try_files $uri $uri/index.html /product.html;
    }

    # --- Everything else -----------------------------------------------------
    location / {
        try_files $uri $uri/ /404.html;
    }

    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /500.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /robots.txt { log_not_found off; access_log off; }
}

server {
    listen 80;
    server_name your-store-domain.example;
    return 301 https://$host$request_uri;
}
